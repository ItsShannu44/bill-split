name: CI

# Runs on every branch so Lazarus can test its fix branches.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every JavaScript file
        run: |
          status=0
          for f in $(find src test -name '*.js'); do
            node --check "$f" || status=1
          done
          exit $status
      - name: Unit tests
        run: npm test
